[package]
name = "laya-serve"
version = "0.1.0"
edition = "2021"
description = "Self-contained laya-system-one HTTP server: Axum + tokenizers + ONNX Runtime (statically linked). Zero runtime deps (musl) or libc-only (glibc)."
license = "Apache-2.0"

[[bin]]
name = "laya-serve"
path = "src/main.rs"

[dependencies]
# ONNX Runtime. Features are additive in Cargo, so ort's API level is
# controlled by OUR features, not by listing features here: the default
# build uses api-27 (matches the 1.28 prebuilts ort-sys downloads), and
# --no-default-features --features mac-x64-legacy rebuilds against api-22
# for the last Intel dylib (see [features] and ci.yml).
ort = { version = "2.0.0-rc.10", default-features = false, features = ["half"] }
# HF tokenizers with fancy-regex (pure Rust) instead of onig (onig_sys
# bundles+compiles C code — breaks cross builds; our tokenizer.json needs
# no regex anyway: Metaspace + BPE only). Drops: progressbar, esaxx_fast.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
# HTTP server + JSON
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI args
clap = { version = "4", features = ["derive"] }

[features]
# The normal build. Mirrors ort's own defaults minus the download/tls bits
# we do not need, pinned to api-27 (matches the 1.28 prebuilts ort-sys
# downloads for every target except x86_64-apple-darwin).
default = ["ort/std", "ort/ndarray", "ort/tracing", "ort/download-binaries", "ort/tls-native", "ort/copy-dylibs", "ort/api-27"]
# mac-x64 legacy: ort-sys ships no prebuilt for x86_64-apple-darwin, and
# Microsoft stopped publishing osx-x86_64 dylibs after ORT 1.23 (the last one
# supports up to API 22). Rebuilds ort against API 22 only, which covers
# everything laya-serve uses (init + Session + inputs + run). The CI links
# the official 1.22.0 dylib for this target (see .github/workflows/ci.yml).
mac-x64-legacy = ["ort/std", "ort/ndarray", "ort/tracing", "ort/copy-dylibs", "ort/api-22", "ort/tls-native"]

[build-dependencies]
cc = "1"
# Fast base64 not needed; keep minimal.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
