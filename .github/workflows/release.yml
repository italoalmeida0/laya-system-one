name: release

# Tag-driven release pipeline: test everything, build every native binary,
# build the model chunk packages, then publish a GitHub Release with the
# assets. npm publishing is a separate, manually-triggered workflow
# (publish-npm.yml) so nothing goes to the registry by accident.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  npm_config_fund: 'false'
  npm_config_audit: 'false'

jobs:
  test:
    name: gate (lint + unit + packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:packaging

  binaries:
    name: build native binaries
    uses: ./.github/workflows/build-binaries.yml

  model:
    name: build model chunk packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Restore model cache
        uses: actions/cache@v6
        with:
          path: models/model.onnx
          key: model-${{ hashFiles('models/model.manifest.json') }}

      - name: Acquire model
        run: npm run model:acquire

      - name: Build chunk packages + manifest
        run: npm run model:chunks -- --chunk-mb 24 --model-version 1.0.0

      - name: Reassemble and verify (round-trip proof)
        run: |
          npm run model:assemble -- --out "$RUNNER_TEMP/model.from-chunks.onnx"
          npm run model:verify -- --model "$RUNNER_TEMP/model.from-chunks.onnx"

      - name: Pack chunk packages
        run: |
          mkdir -p chunk-tarballs
          for d in dist/model-chunks/laya-system-one-model-chunk-*; do
            (cd "$d" && npm pack --pack-destination "$GITHUB_WORKSPACE/chunk-tarballs")
          done
          cp models/model.manifest.json chunk-tarballs/

      - name: Upload model asset
        uses: actions/upload-artifact@v7
        with:
          name: model-asset
          path: models/model.onnx
          retention-days: 14
          compression-level: 0

      - name: Upload chunk tarballs
        uses: actions/upload-artifact@v7
        with:
          name: model-chunks
          path: chunk-tarballs/
          retention-days: 14

  release:
    name: publish github release
    needs: [test, binaries, model]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download & stage native binaries
        uses: ./.github/actions/stage-binaries

      - uses: actions/download-artifact@v8
        with:
          name: model-asset
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          name: model-chunks
          path: release-assets/chunks

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/bin
          cp -r dist/bin/. release-assets/bin/
          echo '--- release assets ---'
          find release-assets -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/model.onnx
            release-assets/bin/**
            release-assets/chunks/*.tgz
            release-assets/chunks/model.manifest.json
          body: |
            ## Laya System-One ${{ github.ref_name }}

            | asset | what it is |
            |---|---|
            | `model.onnx` | INT8 checkpoint (~324 MB) |
            | `model.manifest.json` | sha256 of the model and of every chunk |
            | `bin/<platform>/laya-serve` | native binaries (5 targets) |
            | `laya-system-one-model-chunk-*.tgz` | the model split for npm |

            Verify the download with `npm run model:verify`.
