name: release

# Tag-driven release pipeline: test everything, build every native binary,
# build the model chunk packages, then publish a GitHub Release with the
# assets. npm publishing is a separate, manually-triggered workflow
# (publish-npm.yml) so nothing goes to the registry by accident.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  npm_config_fund: 'false'
  npm_config_audit: 'false'

jobs:
  test:
    name: gate (lint + unit + packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:packaging

  binaries:
    name: build native binaries
    uses: ./.github/workflows/build-binaries.yml

  model:
    name: build model chunk packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: models/model.onnx
          key: model-${{ hashFiles('models/model.manifest.json') }}

      - name: Acquire model
        run: npm run model:acquire

      - name: Build chunk packages + manifest
        run: npm run model:chunks -- --chunk-mb 24 --model-version 1.0.0

      - name: Reassemble and verify (round-trip proof)
        run: |
          npm run model:assemble -- --out "$RUNNER_TEMP/model.from-chunks.onnx"
          npm run model:verify -- --model "$RUNNER_TEMP/model.from-chunks.onnx"

      - name: Pack chunk packages
        run: |
          mkdir -p "$RUNNER_TEMP/chunk-tarballs"
          for d in dist/model-chunks/laya-system-one-model-chunk-*; do
            (cd "$d" && npm pack --pack-destination "$RUNNER_TEMP/chunk-tarballs")
          done
          cp models/model.manifest.json "$RUNNER_TEMP/chunk-tarballs/"

      - name: Upload model asset + chunk tarballs
        uses: actions/upload-artifact@v4
        with:
          name: model-assets
          path: |
            models/model.onnx
            ${{ runner.temp }}/chunk-tarballs/
          retention-days: 14

  release:
    name: publish github release
    needs: [test, binaries, model]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
          pattern: '*-*'
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: model-assets
          path: release-assets

      - name: Assemble release assets
        shell: bash
        run: |
          mkdir -p release-assets/bin
          cp -r dist/bin/* release-assets/bin/
          ls -laR release-assets | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/model.onnx
            release-assets/bin/**
            release-assets/*.tgz
          body: |
            ## Laya System-One ${{ github.ref_name }}

            - `model.onnx` — INT8 checkpoint (sha256 in `model.manifest.json`)
            - `bin/<platform>/laya-serve` — native binaries
            - `laya-system-one-model-chunk-*.tgz` — the model split for npm
            - `model.manifest.json` — checksums and chunk metadata

            Verify: `npm run model:verify` against `model.manifest.json`.
