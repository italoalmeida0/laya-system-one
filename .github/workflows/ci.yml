name: CI

# Every platform, architecture and libc we support, plus Bun. The bundled
# native binary is the PRIMARY inference path, so the full-stack jobs build
# it and the tests FAIL if it is missing (a silent wasm fallback would hide
# a broken install - wasm is the browser/edge safety net only).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_config_fund: 'false'
  npm_config_audit: 'false'

jobs:
  # ------------------------------------------------------------------
  # fast, offline gate: syntax, packaging metadata, docs consistency
  # ------------------------------------------------------------------
  lint:
    name: lint & hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint

  # ------------------------------------------------------------------
  # unit + packaging on every OS / architecture / runtime
  # ------------------------------------------------------------------
  unit:
    name: unit (${{ matrix.name }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'linux-x64 node18',  os: ubuntu-latest,     node: 18.x }
          - { name: 'linux-x64 node20',  os: ubuntu-latest,     node: 20.x }
          - { name: 'linux-x64 node22',  os: ubuntu-latest,     node: 22.x }
          - { name: 'linux-x64 node24',  os: ubuntu-latest,     node: 24.x }
          - { name: 'linux-arm64 node22', os: ubuntu-24.04-arm, node: 22.x }
          - { name: 'win-x64 node22',    os: windows-latest,    node: 22.x }
          - { name: 'win-arm64 node22',  os: windows-11-arm,    node: 22.x }
          - { name: 'mac-arm64 node22',  os: macos-latest,      node: 22.x }
          - { name: 'mac-x64 node22',    os: macos-15-intel,    node: 22.x }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:packaging

  # ------------------------------------------------------------------
  # musl (Alpine) - the other libc. No native binary is built here (the
  # musl bundle is produced by the release pipeline), so this job proves
  # the JS stack and the tokenizer are libc-independent.
  # ------------------------------------------------------------------
  musl:
    name: musl (alpine node22)
    needs: lint
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: node -e "console.log('libc check:', process.report.getReport().header.glibcVersionRuntime || 'musl')"
      - run: npm run test:unit
      - run: npm run test:packaging
      - run: npm run tokenizer:diff

  # ------------------------------------------------------------------
  # musl full stack: the OTHER libc. Built natively inside Alpine with the
  # musl-native onnxruntime libs from the Alpine repo (the PyPI .so is
  # glibc-linked and can never load there), then the whole suite runs on it.
  # ------------------------------------------------------------------
  musl-full:
    name: full stack (linux-${{ matrix.arch }} musl)
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, triple: x86_64-unknown-linux-musl }
          - { arch: arm64, runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    env:
      LAYA_REQUIRE_MODEL: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }

      - name: Restore model cache
        uses: actions/cache@v6
        with:
          path: models/model.onnx
          key: model-${{ hashFiles('models/model.manifest.json') }}

      - name: Acquire model on the host (cached, shared with the container)
        run: npm ci && npm run model:acquire

      # The musl binary must be built and run on real musl with the musl-native
      # onnxruntime libs (the PyPI .so is glibc-linked and can never load on
      # Alpine - see BUILD.md). A job-level `container: alpine` would break the
      # JS actions (their node is glibc), so the Alpine work runs inside Docker
      # and everything else stays on the host.
      - name: Build + test inside Alpine (musl)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.22 sh -euxc '
            apk add --no-cache nodejs npm build-base rust cargo git curl python3 onnxruntime onnxruntime-dev
            echo "--- musl runtime ---"
            ls /lib/ld-musl* || true
            ls -la /usr/lib/libonnxruntime* || true

            echo "--- build laya-serve (musl) ---"
            cargo build --release --target ${{ matrix.triple }} --manifest-path native/laya-serve/Cargo.toml

            BIN="$PWD/native/laya-serve/target/${{ matrix.triple }}/release/laya-serve"
            chmod +x "$BIN"
            file "$BIN" || true
            export LAYA_SERVE_BIN="$BIN"

            echo "--- install + test ---"
            npm ci
            npm run model:acquire
            npm run test:integration
            npm run test:e2e
            node tools/bench.js --backend native --questions 5 --json bench-native.json
          '

      - name: Upload benchmark
        uses: actions/upload-artifact@v7
        with:
          name: bench-linux-${{ matrix.arch }}-musl
          path: bench-native.json
          retention-days: 30

  # ------------------------------------------------------------------
  # full stack: build the native binary (PRIMARY backend), fetch the real
  # model, then run integration + e2e + model chunks + install simulation
  # + latency benchmark + Bun. Tests fail if the binary is missing.
  # ------------------------------------------------------------------
  full-stack:
    name: full stack (${{ matrix.name }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'linux-x64 glibc', os: ubuntu-latest,     target: x86_64-unknown-linux-gnu,      out: dist/bin/linux-x64/laya-serve }
          - { name: 'linux-arm64 glibc', os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,   out: dist/bin/linux-arm64/laya-serve }
          - { name: 'win-x64',        os: windows-latest,    target: x86_64-pc-windows-msvc,        out: dist/bin/win32-x64/laya-serve.exe }
          - { name: 'win-arm64',      os: windows-11-arm,    target: aarch64-pc-windows-msvc,       out: dist/bin/win32-arm64/laya-serve.exe }
          - { name: 'mac-arm64',      os: macos-latest,      target: aarch64-apple-darwin,          out: dist/bin/darwin-arm64/laya-serve }
          - { name: 'mac-x64',        os: macos-15-intel,    target: x86_64-apple-darwin,           out: dist/bin/darwin-x64/laya-serve }
    runs-on: ${{ matrix.os }}
    env:
      LAYA_REQUIRE_MODEL: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }

      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native/laya-serve }

      - name: Build laya-serve (primary backend)
        run: cargo build --release --target ${{ matrix.target }} --manifest-path native/laya-serve/Cargo.toml

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname '${{ matrix.out }}')"
          BIN="native/laya-serve/target/${{ matrix.target }}/release/laya-serve"
          [[ "${{ matrix.out }}" == *.exe ]] && BIN="$BIN.exe"
          cp "$BIN" '${{ matrix.out }}'
          chmod +x '${{ matrix.out }}' 2>/dev/null || true
          ls -la "$(dirname '${{ matrix.out }}')"

      - run: npm ci

      - name: Restore model cache
        uses: actions/cache@v6
        with:
          path: models/model.onnx
          key: model-${{ hashFiles('models/model.manifest.json') }}

      - name: Acquire model (verified download)
        run: npm run model:acquire

      - name: Native binary is required (no silent wasm fallback)
        run: node -e "import('./src/laya-native.js').then(m=>{console.log('platform slot:',m.shippedPlatformDir(),'| musl:',m.isMusl(),'| bundled:',m.hasBundledBinary());if(!m.hasBundledBinary())process.exit(1)})"

      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run test:packaging

      - name: Model chunk pipeline (split -> chunks -> reassemble)
        shell: bash
        run: |
          npm run model:chunks -- --chunk-mb 24 --model-version 1.0.0
          npm run model:assemble -- --out "$RUNNER_TEMP/model.from-chunks.onnx"
          npm run model:verify -- --model "$RUNNER_TEMP/model.from-chunks.onnx"
          node ./tools/run-tests.js tests/integration/model-distribution.test.js

      - name: Install simulation (pack -> install into a clean dir -> run)
        run: npm run test:install

      - name: Latency benchmark (native, primary path)
        run: node tools/bench.js --backend native --questions 10 --json bench-native.json

      - name: Bun runtime smoke
        uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun tests/bun/smoke.js

      - name: Upload benchmark
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.name }}
          path: bench-native.json
          retention-days: 30
