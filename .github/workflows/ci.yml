name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_config_fund: 'false'
  npm_config_audit: 'false'

jobs:
  # ------------------------------------------------------------------
  # fast, offline gate: syntax, packaging metadata and docs consistency
  # ------------------------------------------------------------------
  lint:
    name: lint & hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ------------------------------------------------------------------
  # unit tests + packaging across the runtimes and OSes we support
  # ------------------------------------------------------------------
  unit:
    name: unit (node ${{ matrix.node }} / ${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 18.x }
          - { os: ubuntu-latest, node: 20.x }
          - { os: ubuntu-latest, node: 22.x }
          - { os: ubuntu-latest, node: 24.x }
          - { os: windows-latest, node: 22.x }
          - { os: macos-latest, node: 22.x }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:packaging

  # ------------------------------------------------------------------
  # the real thing: build the native binary, fetch the model and run the
  # whole engine stack (native + ort, wire protocol, CLI, fresh install)
  # ------------------------------------------------------------------
  verify:
    name: full stack (native binary + real model)
    needs: lint
    runs-on: ubuntu-latest
    env:
      LAYA_REQUIRE_MODEL: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/laya-serve

      - name: Build laya-serve (linux-x64)
        run: cargo build --release --target x86_64-unknown-linux-gnu --manifest-path native/laya-serve/Cargo.toml

      - name: Stage binary
        run: |
          mkdir -p dist/bin/linux-x64
          cp native/laya-serve/target/x86_64-unknown-linux-gnu/release/laya-serve dist/bin/linux-x64/laya-serve
          chmod +x dist/bin/linux-x64/laya-serve

      - run: npm ci

      - name: Restore model cache
        uses: actions/cache@v6
        with:
          path: models/model.onnx
          key: model-${{ hashFiles('models/model.manifest.json') }}

      - name: Acquire model (verified download)
        run: npm run model:acquire

      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run test:packaging
      - run: npm run test:install

  # ------------------------------------------------------------------
  # the model-over-npm pipeline: split -> chunk packages -> reassemble
  # must reproduce the checkpoint byte-for-byte
  # ------------------------------------------------------------------
  model-distribution:
    name: model chunk pipeline
    needs: lint
    runs-on: ubuntu-latest
    env:
      LAYA_REQUIRE_MODEL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Restore model cache
        uses: actions/cache@v6
        with:
          path: models/model.onnx
          key: model-${{ hashFiles('models/model.manifest.json') }}

      - name: Acquire model
        run: npm run model:acquire

      - name: Build chunk packages
        run: npm run model:chunks -- --chunk-mb 24 --model-version 1.0.0

      - name: Reassemble from chunks
        run: npm run model:assemble -- --out "$RUNNER_TEMP/model.from-chunks.onnx"

      - name: Verify checksums
        run: npm run model:verify -- --model "$RUNNER_TEMP/model.from-chunks.onnx"

      - name: Chunk pipeline tests (real model)
        run: node ./tools/run-tests.js tests/integration/model-distribution.test.js

      - name: Upload chunk packages
        uses: actions/upload-artifact@v7
        with:
          name: model-chunks
          path: dist/model-chunks/
          retention-days: 7
